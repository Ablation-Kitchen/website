name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; main runs (and so production deploys) queue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every blocking job below is a required status check on main (docs/deploy.md):
# Astro check, ESLint, Prettier, Build, CSP check, Accessibility, Lighthouse CI,
# Internal links, Draft preview, Unit tests, E2E. Keep their names stable: branch protection matches on them.
# Vale only warns and is not required.
jobs:
  check:
    name: Astro check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  # Blocking: Vitest (src/**, scripts/**).
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Chromium is for build-time Mermaid.
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: pnpm build
      # Every page's og:image is a 1200×630 card in dist/og/ (#39).
      - run: pnpm test:og
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Blocking (#21, #25): loads every built page under the real _headers (via
  # wrangler dev) and fails on any CSP or Trusted Types violation.
  csp:
    name: CSP check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: pnpm test:csp
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: csp-test-results
          path: test-results/
          retention-days: 7

  # Blocking (#28): axe on every page in e2e/pages.ts, Light and Dark, with and
  # without reduced motion.
  a11y:
    name: Accessibility
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: pnpm test:a11y
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-test-results
          path: test-results/
          retention-days: 7

  # Blocking (#28): Lighthouse on every page in e2e/pages.ts, mobile, 3 runs,
  # against the thresholds in lighthouserc.js.
  lhci:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: pnpm test:lhci
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # Blocking (#28): every link between built files and every #anchor, offline.
  # External links are checked weekly instead (links.yml).
  links:
    name: Internal links
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lychee
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: scripts/check-links.sh internal

  # Blocking: every e2e/*.e2e.ts against the built site, including the page
  # tests (about, …) that the CSP and Accessibility jobs don't run.
  e2e:
    name: E2E
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

  # Blocking: builds with draft case studies too (PREVIEW_DRAFTS=1, never deployed),
  # so build-time Mermaid in Chromium, the case-study template and their CSP and
  # axe results are exercised before the first case study is published (#31).
  drafts:
    name: Draft preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: pnpm build
        env:
          PREVIEW_DRAFTS: '1'
      - run: pnpm test:og
        env:
          PREVIEW_DRAFTS: '1'
      - run: pnpm test:csp
      - run: pnpm test:a11y
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: draft-preview-test-results
          path: test-results/
          retention-days: 7

  # Warn only (#28): the GLOSSARY.md vocabulary on src/content/**. Findings are
  # annotations on the PR; the job never fails on them.
  prose:
    name: Vale (warn only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install Vale
        env:
          VERSION: 3.25.1
          SHA256: 4bf5c5176b682b1da0830f471584d3494f1c2e27ee3029e1ad6f6661d4962182
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/vale"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/vale.tar.gz" \
            "https://github.com/errata-ai/vale/releases/download/v$VERSION/vale_${VERSION}_Linux_64-bit.tar.gz"
          echo "$SHA256  $dir/vale.tar.gz" | sha256sum -c -
          tar -xzf "$dir/vale.tar.gz" -C "$dir" vale
          echo "$dir" >> "$GITHUB_PATH"
      - run: node scripts/vale-rules.ts
      - name: Vale
        run: |
          vale --minAlertLevel=warning --output=line --no-exit src/content \
            | awk -F: '{ msg=$0; sub(/^[^:]*:[^:]*:[^:]*:[^:]*:/, "", msg); printf "::warning file=%s,line=%s,col=%s,title=%s::%s\n", $1, $2, $3, $4, msg }'

  # PR preview: an aliased Version URL, pr-<n>-ablation-kitchen.<subdomain>.workers.dev.
  # Skipped (not failed) when the Cloudflare secrets are missing, e.g. on fork PRs.
  preview:
    name: Deploy preview
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets are not available; skipping the preview deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v7
      - if: steps.secrets.outputs.present == 'true'
        uses: ./.github/actions/setup
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Upload preview version
        if: steps.secrets.outputs.present == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload \
            --preview-alias "pr-$PR_NUMBER" \
            --message "PR #$PR_NUMBER at ${COMMIT_SHA:0:7}" \
            | tee wrangler.log
          url=$(grep -oE "https://pr-$PR_NUMBER-[a-z0-9.-]+\.workers\.dev" wrangler.log | head -n1 || true)
          if [ -n "$url" ]; then
            echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Preview URL::$url"
          fi

  # Production: only after every blocking check passes on main.
  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, lint, format, unit, build, csp, a11y, lhci, links, e2e, drafts]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets are not available; skipping the production deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v7
      - if: steps.secrets.outputs.present == 'true'
        uses: ./.github/actions/setup
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Deploy
        if: steps.secrets.outputs.present == 'true'
        run: pnpm exec wrangler deploy --message "main at ${GITHUB_SHA:0:7}"
