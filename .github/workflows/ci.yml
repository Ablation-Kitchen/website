name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; main runs (and so production deploys) queue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The four jobs below are the required status checks on main (docs/deploy.md).
# Keep their names stable: branch protection matches on them.
jobs:
  check:
    name: Astro check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Chromium is for build-time Mermaid and the browser checks in later tickets.
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # PR preview: an aliased Version URL, pr-<n>-ablation-kitchen.<subdomain>.workers.dev.
  # Skipped (not failed) when the Cloudflare secrets are missing, e.g. on fork PRs.
  preview:
    name: Deploy preview
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets are not available; skipping the preview deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v7
      - if: steps.secrets.outputs.present == 'true'
        uses: ./.github/actions/setup
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Upload preview version
        if: steps.secrets.outputs.present == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload \
            --preview-alias "pr-$PR_NUMBER" \
            --message "PR #$PR_NUMBER at ${COMMIT_SHA:0:7}" \
            | tee wrangler.log
          url=$(grep -oE "https://pr-$PR_NUMBER-[a-z0-9.-]+\.workers\.dev" wrangler.log | head -n1 || true)
          if [ -n "$url" ]; then
            echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Preview URL::$url"
          fi

  # Production: only after all four checks pass on main.
  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, lint, format, build]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets are not available; skipping the production deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v7
      - if: steps.secrets.outputs.present == 'true'
        uses: ./.github/actions/setup
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Deploy
        if: steps.secrets.outputs.present == 'true'
        run: pnpm exec wrangler deploy --message "main at ${GITHUB_SHA:0:7}"
