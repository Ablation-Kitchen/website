name: External links

# Warn only (#28, decision #20): links off the site, checked weekly rather than
# per PR, because other sites' outages shouldn't block merges. Broken links go
# into one open "Broken external links" issue, which this updates each week and
# closes once every link works again.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: external-links
  cancel-in-progress: false

jobs:
  external:
    name: External links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: pnpm build
      - uses: ./.github/actions/lychee
      - name: Check external links
        id: lychee
        env:
          # lychee uses it for github.com links, which are rate-limited without one.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          scripts/check-links.sh external --format markdown --output lychee-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat lychee-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Broken external links"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ "$EXIT_CODE" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Every external link works again ($RUN_URL)."
            fi
            exit 0
          fi
          if [ "$EXIT_CODE" != "2" ]; then
            echo "::error::lychee exited with $EXIT_CODE (not a link failure); see the log."
            exit 1
          fi
          {
            echo "The weekly external link check found broken links in the built site."
            echo "Run: $RUN_URL. This issue is updated each week and closed when all links pass."
            echo
            cat lychee-report.md
          } > issue.md
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file issue.md
          else
            gh issue create --title "$title" --body-file issue.md
          fi
          echo "::warning::Broken external links found; see the \"$title\" issue."
